name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do (or do comfortably) today? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional — how you imagine it working.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Map / semantic zoom
        - Execution recording / playback
        - Editor integration
        - CLI
        - Formats (graph-core / trace-format)
        - Docs
        - Other
    validations:
      required: true
